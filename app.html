<title>AI 工具箱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版式：首页是一个书架，五本书是五个功能；点一本，进入对应的功能页。整站是深靛蓝底 + 一点金色。 */
:root {
  color-scheme: dark;
  --paper: #171B27;
  --sheet: #212838;
  --ink: #F1ECE3;
  --ink-2: #A9B0C0;
  --ink-3: #7C8596;
  --rule: #2D364A;
  --accent: #E6B96C;
  --accent-ink: #171B27;
  --accent-soft: rgba(230, 185, 108, .14);
  --code-bg: #0E1119;
  --code-fg: #C9D2E6;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }

/* ── 首页：书架 ── */
.home-title { font-size: 17px; line-height: 1.4; margin: 0 0 20px; font-weight: 500; text-align: center; color: var(--ink-2); letter-spacing: .04em; }
#shelf.nogl { display: none; }
.pick { padding: 4px 0 0; text-align: center; }
.pick h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.3; }
.pick #pk-text { margin: 0 auto; max-width: 24em; color: var(--ink-2); font-size: 15px; line-height: 1.6; min-height: 3.2em; } /* 固定两行的高度，换书时下面的书不会跳 */
.pick .shelf-hint { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); opacity: .8; }
#stage { position: relative; height: 372px; margin: 6px -16px 0; background: radial-gradient(80% 60% at 50% 38%, #2B3248 0%, #1A1F2E 62%, #14171F 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 100%); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
/* 3D 书架用不了时，首页改成这个列表 */
#fallback-list { display: none; }
#shelf.nogl + #fallback-list { display: block; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--rule); }
.list li:last-child { border-bottom: 1px solid var(--rule); }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 18px 0 16px; }
.row h3 { margin: 0 0 4px; font-size: 20px; line-height: 1.35; }
.row p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.6; }
.row:hover h3 { color: var(--accent); }
.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 32px; }
.foot { margin-top: 24px; font-size: 13px; color: var(--ink-2); }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 8px; vertical-align: 1px; }
.status-dot.on { background: #7FD3A0; }

/* ── 按钮 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border-radius: var(--radius);
  border: 1px solid var(--rule); background: var(--sheet); font-size: 17px; font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 20px; height: 20px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px;
  padding: 8px 14px; font-size: 15px; line-height: 1.3; text-align: left;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ── 场次页 ── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--paper); padding-block: 10px; border-bottom: 1px solid var(--rule);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.back { background: none; border: 0; min-height: 44px; padding: 0 12px 0 4px; font-size: 17px; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
.scene { display: grid; gap: 18px; padding-top: 18px; }
.slug { font-family: var(--font-mono); font-size: 13px; letter-spacing: .12em; color: var(--accent); }
.scene h2 { font-size: 28px; line-height: 1.25; }
.scene .lead { margin: 0; color: var(--ink-2); }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.label { font-size: 13px; color: var(--ink-2); letter-spacing: .06em; }

/* 输入区 */
.say { display: grid; gap: 10px; }
.say textarea {
  width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--sheet); padding: 12px 14px; font-size: 18px; line-height: 1.55;
}
.say-row { display: flex; gap: 10px; }
.say-row .btn.primary { flex: 1; }
.mic { width: 52px; padding: 0; flex: none; }
.mic.rec { background: #C2412F; border-color: #C2412F; color: #fff; }
.hint { font-size: 13px; color: var(--ink-3); margin: 0; }

/* 结果卡 */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 16px 14px; display: grid; gap: 8px; min-width: 0; }
.card h3 { font-size: 18px; }
.card p { margin: 0; }
.card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.card-k { font-size: 13px; color: var(--accent); letter-spacing: .08em; font-weight: 600; }
.cards { display: grid; gap: 10px; }
.card-actions { display: flex; justify-content: flex-end; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 15px; padding: 6px 2px; font-weight: 600; }
.badge-demo { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--rule); border-radius: 6px; padding: 2px 8px; justify-self: start; }
.thinking { color: var(--ink-2); font-size: 15px; display: flex; align-items: center; gap: 10px; }
.thinking::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 对话 */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 88%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.bubble.ai { background: var(--sheet); border: 1px solid var(--rule); justify-self: start; border-bottom-left-radius: 4px; }
.bubble.me { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; }
.bubble .who { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }
.speak-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); background: none; border: 0; padding: 4px 0; }

/* 记者 */
.q-card { background: var(--ink); color: var(--paper); border-radius: var(--radius); padding: 20px 18px; display: grid; gap: 10px; }
.q-card .q-no { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; opacity: .7; }
.q-card .q-text { font-family: var(--font-display); font-size: 22px; line-height: 1.45; }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* 做网页 */
.codewin { background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; height: 220px; overflow: hidden; white-space: pre-wrap; word-break: break-all; position: relative; }
.codewin-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.phone { border: 1px solid var(--rule); border-radius: 22px; overflow: hidden; background: #fff; max-width: 100%; }
.phone iframe { display: block; width: 100%; height: 600px; border: 0; background: #fff; }

/* 台词 */
.line-pick { display: grid; gap: 8px; }
.line-pick .chip { border-radius: var(--radius); font-family: var(--font-display); font-size: 16px; padding: 10px 14px; }
.photo-btn { position: relative; overflow: hidden; }
.photo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.thumb { max-height: 160px; border-radius: 8px; border: 1px solid var(--rule); justify-self: start; }

/* 弹层 */
.sheet-modal { position: fixed; inset: 0; background: rgb(0 0 0 / .4); display: grid; place-items: end center; z-index: 20; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-modal .panel { width: 100%; max-width: 520px; }
.sheet-modal input { width: 100%; min-height: 52px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); padding: 0 14px; font-size: 20px; letter-spacing: .2em; }

/* 话术卡 */
.script-list { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; }
.script-list li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.script-list li::before { content: counter(s); font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.3; }
.script-list q { quotes: "「" "」"; font-size: 18px; }
.script-list .when { display: block; font-size: 13px; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.cfg { margin-top: 8px; }
.cfg summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.cfg summary::-webkit-details-marker { display: none; }
.cfg .cfg-tip { margin-left: auto; color: var(--ink-3); font-size: 14px; }
.cfg[open] .cfg-tip { display: none; }
.cfg #cfg-body { padding-bottom: 32px; }
</style>

<div class="wrap" id="app">

  <!-- 首页：书架 -->
  <section id="v-home" data-view>
    <h1 class="home-title">今天想用 AI 做点什么？</h1>
    <div id="shelf" aria-label="功能书架">
      <div class="pick">
        <h2 id="pk-title"></h2>
        <p id="pk-text"></p>
        <p class="shelf-hint">点一下打开，左右滑动换一本</p>
      </div>
      <div id="stage"></div>
    </div>
    <!-- 只在 3D 书架用不了时才显示 -->
    <div id="fallback-list"><ol class="list" id="list"></ol></div>
    <div class="home-links">
      <button class="btn" type="button" data-go="saved">我的收藏</button>
      <button class="btn" type="button" data-go="script">随身话术卡</button>
    </div>
    <!-- 页面最底部：点一下展开，直接填 API Key -->
    <details id="cfg" class="cfg">
      <summary class="foot"><span class="status-dot" id="dot"></span><span id="mode">正在连接 AI…</span><span class="cfg-tip">设置 ›</span></summary>
      <div id="cfg-body"></div>
    </details>
  </section>

  <!-- 功能页容器：点书之后进来，左上角返回 -->
  <section id="v-scene" data-view hidden>
    <div class="topbar">
      <button class="back" type="button" data-go="home" aria-label="返回">‹ 返回</button>
    </div>
    <div id="scene-body" class="scene"></div>
  </section>
</div>

<div class="sheet-modal" id="code-modal" hidden>
  <form class="panel" id="code-form">
    <h3>输入访问码</h3>
    <p class="muted small" style="margin:0">胶布老师会把访问码发给你，只需要输一次。</p>
    <label class="label" for="code-input">访问码</label>
    <input id="code-input" inputmode="numeric" autocomplete="off">
    <button class="btn primary" type="submit">进入</button>
  </form>
</div>

<script>
(() => {
"use strict";

/* ───────────── 公开角色资料（团队演示前请核对） ───────────── */
const ROLES = [
  { name: "黄蓉", show: "《射雕英雄传》（2017）", trait: "机灵、反应快，总能想到别人想不到的办法。" },
  { name: "陆文昔", show: "《鹤唳华亭》", trait: "外柔内刚，能忍，也能在关键时刻站出来。" },
  { name: "孟钰", show: "《狂飙》", trait: "记者，直来直去，正义感强，一定要问出真相。" },
  { name: "宋小鱼", show: "《书卷一梦》", trait: "被丢进剧本里的小演员，不服命运，越挫越有梗。" },
  { name: "余梦", show: "《美人余》", trait: "从依附别人的全职太太，变成独立的律师，一步步把人生拿回来。" },
];
const ROLE_TEXT = ROLES.map(r => `- ${r.name}，${r.show}：${r.trait}`).join("\n");
const RULES = "规则：用简体中文；不评价她的表演，不打分；不提外貌、身材、年龄；不编造她的经历、剧情或她没说过的话。";

/* ───────────── 小工具 ───────────── */
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("ytlab." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ytlab." + k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};
const iconBtn = (html) => { const s = document.createElement("span"); s.innerHTML = html; return s.firstChild; };
function parseJSON(text) {
  try { return JSON.parse(text); } catch {}
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) { try { return JSON.parse(m[1]); } catch {} }
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(text.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}

/* ───────────── AI 接入：自建服务器（豆包）→ Claude 预览 → 演示模式 ───────────── */
const AI = { mode: "connecting", sample: null };
async function initAI() {
  try {
    const r = await fetch("api/health", { cache: "no-store" });
    if (r.ok) { const j = await r.json(); if (j && j.ai) { AI.mode = "server"; AI.label = j.label || "豆包"; return showMode(); } }
  } catch {}
  const ark = store.get("ark", null);
  if (ark && ark.key) { AI.mode = "direct"; AI.ark = ark; AI.label = "豆包（火山方舟）"; return showMode(); }
  try {
    if (window.claude && window.claude.use) {
      const s = await window.claude.use("sample");
      if (s) { AI.mode = "claude"; AI.sample = s; AI.label = "Claude（预览版）"; return showMode(); }
    }
  } catch {}
  AI.mode = "demo"; showMode();
}
function showMode() {
  const on = AI.mode === "server" || AI.mode === "claude" || AI.mode === "direct";
  $("#dot").classList.toggle("on", on);
  $("#mode").textContent = on ? `AI 已连接：${AI.label}` : AI.mode === "demo" ? "演示模式：AI 没连上，会显示示例结果" : "正在连接 AI…";
}
async function waitAI() { for (let i = 0; i < 120 && AI.mode === "connecting"; i++) await new Promise(r => setTimeout(r, 100)); }

async function shrinkImage(file) {
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) return file;
  const k = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
}
const blobToDataURL = (b) => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });

/** ask({system, messages, json, images, onText, tier, maxTokens, signal}) → string | object */
async function ask({ system, messages = [], json = false, images = [], onText, tier = "quick", maxTokens = 1500, signal }) {
  await waitAI();
  if (AI.mode === "claude") {
    const turns = [{ role: "user", content: system }, ...messages];
    const opts = { modelTier: tier, cache: false };
    if (signal) opts.signal = signal;
    if (onText) opts.onText = ({ text }) => onText(text);
    if (images.length) opts.images = images;
    if (json) return await AI.sample.json(turns, opts);
    return (await AI.sample(turns, opts)).text;
  }
  if (AI.mode === "server") {
    const body = { messages: [{ role: "system", content: system }, ...messages], maxTokens };
    if (images.length) body.images = await Promise.all(images.map(blobToDataURL));
    const r = await fetch("api/chat", {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-access-code": store.get("code", "") },
      body: JSON.stringify(body),
    });
    if (r.status === 401) { askCode(); throw { code: "need_code" }; }
    return finishSSE(r, json, onText);
  }
  if (AI.mode === "direct") {
    const msgs = [{ role: "system", content: system }, ...messages0(messages)];
    if (images.length) {
      const urls = await Promise.all(images.map(blobToDataURL));
      const last = [...msgs].reverse().find(m => m.role === "user");
      if (last) last.content = [{ type: "text", text: last.content }, ...urls.map(url => ({ type: "image_url", image_url: { url } }))];
    }
    const r = await fetch((AI.ark.base || ARK_BASE) + "/chat/completions", {
      method: "POST", signal,
      headers: { "content-type": "application/json", authorization: "Bearer " + AI.ark.key },
      body: JSON.stringify({ model: AI.ark.model || ARK_MODEL, messages: msgs, stream: true, max_tokens: maxTokens }),
    });
    return finishSSE(r, json, onText);
  }
  throw { code: "demo" };
}
const ARK_BASE = "https://ark.cn-beijing.volces.com/api/v3";
const ARK_MODEL = "doubao-seed-2-1-pro-260915";
const messages0 = (m) => m.map(x => ({ role: x.role, content: x.content }));
async function finishSSE(r, json, onText) {
  {
    if (!r.ok || !r.body) throw { code: "upstream_error", status: r.status };
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        const t = line.trim(); if (!t.startsWith("data:")) continue;
        const p = t.slice(5).trim(); if (p === "[DONE]") continue;
        try { const d = JSON.parse(p).choices?.[0]?.delta?.content; if (d) { text += d; onText && onText(text); } } catch {}
      }
    }
    if (!text.trim()) throw { code: "empty_completion" };
    return json ? parseJSON(text) : text;
  }
}
const isHardOff = (e) => ["demo", "not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e && e.code);

/* ───────────── 访问码 ───────────── */
function askCode() {
  const m = $("#code-modal"); m.hidden = false; setTimeout(() => $("#code-input").focus(), 50);
}
$("#code-form").addEventListener("submit", (ev) => {
  ev.preventDefault(); store.set("code", $("#code-input").value.trim()); $("#code-modal").hidden = true;
});

/* ───────────── 朗读 ───────────── */
const TTS = {
  on: store.get("tts", true),
  ok: "speechSynthesis" in window,

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function sayBox({ value = "", placeholder = "", sendText = "发送", rows, onSend }) {
  const ta = el("textarea", { placeholder, "aria-label": placeholder || "输入" });
  ta.value = value; if (rows) ta.style.minHeight = rows + "px";
  const send = el("button", { class: "btn primary", type: "button", text: sendText });
  const row = el("div", { class: "say-row" });
  let rec = null;
  if (SR && AI.mode !== "claude") {
    const mic = el("button", { class: "btn mic", type: "button", "aria-label": "说话输入" }, iconBtn(ICON.mic));
    mic.addEventListener("click", () => {
      if (rec) { rec.stop(); return; }
      try {
        rec = new SR(); rec.lang = "zh-CN"; rec.interimResults = true; rec.continuous = true;
        const base = ta.value ? ta.value + " " : "";
        rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; ta.value = base + t; };
        rec.onend = () => { rec = null; mic.classList.remove("rec"); };
        rec.onerror = (e) => { rec = null; mic.classList.remove("rec"); if (e && /not-allowed|service-not-allowed|network/.test(e.error)) { mic.hidden = true; hint.textContent = "点手机键盘上的麦克风，直接说。"; } };
        rec.start(); mic.classList.add("rec");
      } catch { rec = null; mic.hidden = true; }
    });
    row.append(mic);
  }
  row.append(send);
  const hint = el("p", { class: "hint", text: SR && AI.mode !== "claude" ? "点麦克风说话，说完再点一下。" : "不想打字？点手机键盘上的麦克风，直接说。" });
  const go = () => { const t = ta.value.trim(); if (!t || send.disabled) return; TTS.unlock(); if (rec) rec.stop(); onSend(t, api); };
  send.addEventListener("click", go);
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(); });
  const api = {
    node: el("div", { class: "say" }, ta, row, hint),
    set busy(v) { send.disabled = v; ta.disabled = v; },
    clear() { ta.value = ""; },
    set value(v) { ta.value = v; },
    get value() { return ta.value; },
  };
  return api;
}

/* 先切换页面，再尝试写浏览器历史（让手机的返回手势也能回到首页）。
   在被隔离的预览窗口里写历史会报错，失败了也不影响使用。 */
function goHome() {
  if (pushed) {
    try {
      history.back();
      setTimeout(() => { if (!$("#v-scene").hidden) { pushed = false; render("home"); } }, 400);   // 万一没触发返回，直接回首页
      return;
    } catch {}
  }
  pushed = false;
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  render("home");
}
function go(view, sceneId, noPush) {
  if (view === "home") return goHome();
  render(view, sceneId);
  if (noPush) return;
  try { history.pushState({ v: view, s: sceneId || null }, "", "#" + (sceneId || view)); pushed = true; } catch { pushed = false; }
}
addEventListener("popstate", (e) => {
  const st = e.state;
  if (st && st.v) { pushed = true; render(st.v, st.s); } else { pushed = false; render("home"); }
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go]"); if (t) { e.preventDefault(); go(t.dataset.go); }
});

const WEB_DEFAULT = "帮我做一个测试页，问粉丝 5 个问题，最后告诉他们最像我演过的哪个角色。";
const WEB_TWEAKS = ["换成淡蓝色", "题目再有趣一点", "结果页加一句角色的话", "按钮再大一点"];
function webPrompt(need, prev) {
  const head = `你是一位很会做手机网页的设计师。请做一个完整、能直接运行的单文件 HTML 页面。
要求：
- 只用内联 CSS 和 JS，不引用任何外部资源（字体、图片、脚本、CDN 都不要）。
- 手机竖屏优先，简体中文，字号大，按钮好点；风格简洁、有质感，配色克制。
- 页面主人是演员李一桐，这是她给粉丝的小互动。
- 只能使用下面的公开角色资料，不要编造剧情或台词出处。
- 只输出代码，放在一个 \`\`\`html 代码块里，前后不要写解释。
公开角色资料：
${ROLE_TEXT}`;
  if (!prev) return `${head}\n\n需求：${need}`;
  return `${head}\n\n这是当前页面的完整代码：\n\`\`\`html\n${prev}\n\`\`\`\n\n请按这条修改意见改好，输出改完后的完整代码：${need}`;
}
const extractHTML = (t) => {
  const m = t.match(/```html\s*([\s\S]*?)(```|$)/i); if (m) return m[1];
  const i = t.search(/<!doctype|<html/i); return i >= 0 ? t.slice(i) : t;
};
function sceneWeb(root) {

  const preview = el("div", { class: "cards" });
  const box = sayBox({ value: WEB_DEFAULT, sendText: "直接做", onSend: (t) => build(t) });
  const tweakWrap = el("div", { class: "panel", hidden: "" },
    el("div", { class: "label", text: "想改哪里？说一句就行" }),
    el("div", { class: "chips" }, WEB_TWEAKS.map(t => el("button", { class: "chip", type: "button", text: t, onclick: () => { box.value = t; build(t); } }))));
  root.append(...sceneHead("做一个粉丝测试页", "说一句想要什么，AI 当场做出一个能点着玩的网页，做好还能接着改。"),
    el("div", { class: "panel" }, el("div", { class: "label", text: "你想做什么网页？" }), box.node), preview, tweakWrap);

  async function build(need) {
    ctl && ctl.abort(); ctl = new AbortController();

    const head = el("div", { class: "codewin-head" }, el("span", { text: "AI 正在写代码" }), el("span", { class: "mono", text: "0 行" }));
    const wait = thinking(html ? "正在按你说的改…" : "AI 正在构思页面…");
    preview.replaceChildren(wait);
    let shown = false;
    try {
      const text = await ask({
        system: webPrompt(need, html), tier: "quick", maxTokens: 8000, signal: ctl.signal,
        onText: (t) => {
          if (!shown) { preview.replaceChildren(head, code); shown = true; }
          const src = extractHTML(t); const lines = src.split("\n");
          head.lastChild.textContent = lines.length + " 行";
          code.textContent = lines.slice(-14).join("\n");

      el("div", { class: "phone" }, frame),

    tweakWrap.hidden = false;
  }

}

/* ═════════════ 第五场：回答问题，得到小传 ═════════════ */
const BIO_ROLE = "余梦（《美人余》）：三十岁上下，结婚后做了多年全职太太，婚姻出了问题后，从依附型的“娇妻”一步步变成独立律师，还要和丈夫争财产。她是余家四姐妹之一。（据公开简介）";
const BIO_QS = ["她结婚前，是做什么的？", "她当全职太太那几年，一天里最期待哪个时刻？", "她第一次发现婚姻出问题，是因为一件什么小事？",
  "她决定去当律师，是谁或者哪句话推了她一把？", "她最怕别人怎么评价她？", "四姐妹里，谁最懂她？", "她赢下第一个案子那天晚上，会做什么？", "如果用一件东西代表她，你会选什么？"];
const BIO_N = 8;
function sceneBio(root) {
  let role = BIO_ROLE, qa = [], ctl = null, curQ = "";
  const chat = el("div", { class: "chat", "aria-live": "polite" });
  const out = el("div", { class: "cards" });

  const box = sayBox({ placeholder: "用说话回答，想到哪说到哪", sendText: "回答", onSend: (t) => answer(t) });
  const skip = el("button", { class: "btn ghost", type: "button", text: "跳过这题", onclick: () => answer("（跳过）") });

    el("div", { class: "panel" }, el("div", { class: "label", text: "角色设定（可以改成你的新角色）" }), roleBox, startBtn),
    chat, answerPanel, out);

  const bubble = (who, text) => el("div", { class: "bubble " + who }, el("span", { class: "who", text: who === "ai" ? "表演老师" : "我" }), el("span", { text }));
  async function start() {
    role = roleBox.value.trim() || BIO_ROLE; qa = []; out.replaceChildren(); chat.replaceChildren();
    startBtn.disabled = true; answerPanel.hidden = false; await nextQ();

  async function nextQ() {
    if (qa.length >= BIO_N) return finish();
    box.busy = true;
    const b = bubble("ai", "…"); chat.append(b); const t = b.lastChild;
    ctl = new AbortController();
    try {
      const hist = qa.map((x, k) => `问${k + 1}：${x.q}\n答：${x.a}`).join("\n");
      curQ = (await ask({ tier: "quick", signal: ctl.signal, onText: (x) => { t.textContent = x; },
        system: `你是表演老师，在帮演员李一桐写人物小传。角色设定：${role}
请问她下一个问题（第 ${qa.length + 1} 题，共 ${BIO_N} 题）。要求：只问一个问题，不超过 25 个字；从具体的生活细节问起，帮她想清楚人物；不要重复已经问过的方向；只输出问题本身。${RULES}`,
        messages: [{ role: "user", content: hist ? `已经问过的：\n${hist}` : "开始吧。" }] })).trim();
    } catch (e) {
      if (e && e.code === "cancelled") return;

    TTS.unlock(); chat.append(bubble("me", a)); qa.push({ q: curQ, a }); box.clear(); await nextQ();

    if (ctl) ctl.abort();
    answerPanel.hidden = true; out.replaceChildren(thinking("正在整理小传…"));

    let data, demo = false;
    try {
      if (!real.length) throw { code: "empty" };
      data = await ask({ json: true, tier: "default", system: `根据演员的回答写人物小传。角色设定：${role}
只用她回答里的内容，可以把散的话连成通顺的句子，但不要添加新情节。没说到的部分写“（还没想好）”。
只回复一个 JSON 对象：{"一句话":"…","成长经历":"…","她想要什么":"…","她怕什么":"…","和别人的关系":["…"],"一个细节":"…"}。${RULES}`,
        messages: [{ role: "user", content: real.map(x => `问：${x.q}\n答：${x.a}`).join("\n\n") }] });
    } catch (e) {
      demo = true;
      data = real.length ? Object.fromEntries(real.map(x => [x.q, x.a])) : { "提示": "先回答几个问题，再生成小传。" };

    out.replaceChildren(c); startBtn.disabled = false; startBtn.textContent = "重新来一遍";
  }
  return { abort: () => ctl && ctl.abort() };
}

  });
  const end = (e) => {
    if (!dragging) return; dragging = false; el.style.cursor = "grab";
    if (moved < 8 && performance.now() - t0 < 450) {      // 轻点：点中间那本进入功能页，点旁边的先把它拉到中间
      const i = hit(e.clientX, e.clientY);
      if (i === target) yt.open(i); else if (i >= 0) goTo(i);
      return;
    }
    goTo(scroll - vel * 0.9);
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  addEventListener("keydown", (e) => {
    if (home.hidden) return;
    if (e.key === "ArrowLeft") goTo(target - 1);
    if (e.key === "ArrowRight") goTo(target + 1);
    if (e.key === "Enter" && document.activeElement === document.body) yt.open(target);
  });

  // 按时间缓动：低性能的手机掉帧时，也在同样的时间内滑到位
  let last = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    const t = now || performance.now(), dt = Math.min(0.25, (t - last) / 1000); last = t;
    if (home.hidden) return;                                // 在功能页时不画，省电
    if (!dragging) scroll += (target - scroll) * (reduce ? 1 : 1 - Math.exp(-dt * 8));
    place(); renderer.render(scene, camera);
  })(performance.now());

  addEventListener("resize", () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  });
}
</script>
