<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首页方案 C · 分组</title>
<style>
:root{--paper:#F1F2F4;--sheet:#FFFFFF;--ink:#15171C;--ink-2:#5B606C;--ink-3:#8C919C;--rule:#D8DBE1;--accent:#2D4A8A;--accent-soft:#E4E9F4;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:0 16px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-top:28px}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;line-height:1.3;margin:0 0 22px;font-weight:700}
.group{margin-bottom:22px}
.group h3{margin:0 0 8px;font-size:14px;color:var(--ink-2);letter-spacing:.06em;font-weight:600}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 16px;text-decoration:none;color:inherit}
.item h2{grid-column:1;margin:0;font-size:19px;font-weight:700;line-height:1.35}
.item p{grid-column:1;margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}
.item .go{grid-column:2;grid-row:1 / span 2;color:var(--accent);font-size:22px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.links a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--radius);color:var(--ink);text-decoration:none;font-size:16px;font-weight:600}
.foot{margin-top:24px;font-size:13px;color:var(--ink-3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3F9A62;margin-right:6px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>按你现在的情况选</h1>

  <div class="group">
    <h3>拍戏的时候</h3>
    <div class="items">
      <a class="item" href="#"><h2>古装台词速懂</h2><p>拍一句台词，看白话意思、典故，和人物这时候会怎么做。</p><span class="go">›</span></a>
    </div>
  </div>

  <div class="group">
    <h3>进组之前</h3>
    <div class="items">
      <a class="item" href="#"><h2>职业功课卡</h2><p>和律师、记者或老板聊十分钟，拿到一张常用说法和习惯动作的卡。</p><span class="go">›</span></a>
      <a class="item" href="#"><h2>人物小传生成</h2><p>回答 8 个问题，整理成一份只用你说过的话写的小传。</p><span class="go">›</span></a>
    </div>
  </div>

  <div class="group">
    <h3>发布会、采访前</h3>
    <div class="items">
      <a class="item" href="#"><h2>采访问答练习</h2><p>模拟记者的 5 个问题，每题给 2–3 个要点和一句能直接说的话。</p><span class="go">›</span></a>
    </div>
  </div>

  <div class="group">
    <h3>自己玩</h3>
    <div class="items">
      <a class="item" href="#"><h2>做一个粉丝测试页</h2><p>说一句想要什么，几十秒生成一个能点的小测试，给粉丝玩。</p><span class="go">›</span></a>
    </div>
  </div>

  <div class="links">
    <a href="#">我的收藏</a>
    <a href="#">随身话术卡</a>
  </div>
  <div class="foot"><span class="dot"></span>AI 已连接</div>
</div>
</body>
</html>
