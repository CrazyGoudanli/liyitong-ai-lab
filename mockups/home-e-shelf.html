<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<title>首页方案 E · 书架</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}</script>
<style>
/* 方向：书房的书架。五本书是五个功能，点一本，书往前走，下面展开三步怎么用。
   列表始终在，不依赖 3D；没有 WebGL 时只剩列表。 */
:root{--bg:#161B26;--sheet:#1F2735;--ink:#EEE9E0;--ink-2:#A7AFBE;--line:#2C3648;--lamp:#E3B76A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:0 16px 48px;min-height:100vh}
.wrap{max-width:540px;margin:0 auto;padding-top:32px}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;line-height:1.3;margin:0 0 6px;font-weight:700}
.sub{margin:0 0 16px;color:var(--ink-2);font-size:14px}
#stage{position:relative;height:330px;border-radius:6px;overflow:hidden;background:radial-gradient(90% 70% at 50% 30%,#243049 0%,#161B26 72%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#stage.nogl{display:none}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:var(--ink-2);pointer-events:none}
.list{list-style:none;margin:20px 0 0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:18px 0 16px;cursor:pointer;font:inherit}
.row h2{margin:0 0 4px;font-family:"Noto Serif SC","Songti SC",serif;font-size:21px;font-weight:700;line-height:1.35}
.row p{margin:0 0 10px;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.steps li{border:0}
.steps li::before{content:attr(data-n) " ";color:var(--lamp);font-weight:700}
.row:hover h2,.row.on h2{color:var(--lamp)}
.row:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.links a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px;font-weight:600;border-radius:6px}
.foot{margin-top:24px;font-size:13px;color:var(--ink-2)}
.foot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7FD3A0;margin-right:8px;vertical-align:1px}
/* 详情层 */
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:540px;max-height:80vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform 420ms cubic-bezier(.2,.72,.24,1),visibility 0s linear 420ms;z-index:10}
#sheet.open{transform:translateY(0);visibility:visible;transition:transform 420ms cubic-bezier(.2,.72,.24,1),visibility 0s}
#sheet h2{margin:0 0 6px;font-family:"Noto Serif SC","Songti SC",serif;font-size:24px;line-height:1.3;padding-right:56px}
#sheet .when{margin:0 0 16px;font-size:14px;color:var(--ink-2)}
#sheet ol{margin:0 0 22px;padding:0;list-style:none;display:grid;gap:12px}
#sheet ol li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:16px;line-height:1.5}
#sheet ol b{color:var(--lamp);font-family:"Noto Serif SC","Songti SC",serif;font-size:18px}
.go{display:flex;align-items:center;justify-content:center;min-height:50px;background:var(--lamp);color:#161B26;text-decoration:none;font-weight:700;border-radius:6px;font-size:16px}
.close{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--ink-2);font-size:15px;padding:8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>今天想用 AI 做点什么？</h1>
  <p class="sub">点一本书，或直接在下面选。</p>
  <div id="stage"><div class="hint" id="hint">点书，看怎么用</div></div>
  <ol class="list" id="list"></ol>
  <div class="links"><a href="#">我的收藏</a><a href="#">随身话术卡</a></div>
  <div class="foot"><i></i>AI 已连接</div>
</div>

<section id="sheet" role="dialog" aria-modal="false" aria-labelledby="sh-title" aria-hidden="true">
  <button class="close" id="close" type="button">关闭</button>
  <h2 id="sh-title"></h2>
  <p class="when" id="sh-when"></p>
  <ol id="sh-steps"></ol>
  <a class="go" id="sh-go" href="#">开始</a>
</section>

<script>
/* 数据：五个功能。UI 逻辑不依赖 3D，3D 只是锦上添花。 */
const ITEMS = [
  { name: "做一个粉丝测试页", color: "#B3412E", text: "说一句想要的样子，几十秒做出一个能点的小测试。", when: "想和粉丝互动的时候", steps: ["说一句想要什么", "等几十秒", "点开玩，或接着说“换个颜色”"] },
  { name: "职业功课卡", color: "#3E5C4E", text: "选律师、记者或老板，聊十分钟，收下一张卡。", when: "接新角色、进组之前", steps: ["选一个职业", "聊十分钟", "拿到常用说法和习惯动作"] },
  { name: "采访问答练习", color: "#2D4A8A", text: "模拟记者的 5 个问题，每题给要点和一句能直接说的话。", when: "发布会、采访前", steps: ["选发布会或日常专访", "回答一个问题", "看要点，再答一遍"] },
  { name: "古装台词速懂", color: "#A8683F", text: "拍一句台词，看白话意思、典故，和人物这时候的动作。", when: "台词看不懂的时候", steps: ["拍一句或点一句", "看白话和典故", "看人物的动作"] },
  { name: "人物小传生成", color: "#6E5C7E", text: "回答 8 个问题，整理成只用你说过的话写的小传。", when: "想把角色理清楚", steps: ["回答 8 个问题", "点生成", "逐条改到满意"] },
];

const $ = (s) => document.querySelector(s);
const list = $("#list");
const sheet = $("#sheet");

/* 列表：永远显示，是主要的操作入口 */
ITEMS.forEach((it, i) => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button"; b.className = "row"; b.dataset.i = i;
  b.innerHTML = `<h2></h2><p></p><ol class="steps"></ol>`;
  b.querySelector("h2").textContent = it.name;
  b.querySelector("p").textContent = it.text;
  const ol = b.querySelector(".steps");
  it.steps.forEach((s, k) => { const x = document.createElement("li"); x.dataset.n = (k + 1); x.textContent = s; ol.appendChild(x); });
  b.addEventListener("click", () => openItem(i));
  li.appendChild(b); list.appendChild(li);
});

/* 详情层：书和列表共用同一个入口 */
let cur = -1;
function openItem(i) {
  cur = i;
  const it = ITEMS[i];
  $("#sh-title").textContent = it.name;
  $("#sh-when").textContent = "什么时候用：" + it.when;
  const ol = $("#sh-steps"); ol.replaceChildren();
  it.steps.forEach((s, k) => {
    const li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = k + 1;
    const sp = document.createElement("span"); sp.textContent = s;
    li.append(b, sp); ol.appendChild(li);
  });
  sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false");
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("on", +r.dataset.i === i));
  if (window.shelfFocus) window.shelfFocus(i);
  $("#sh-go").focus({ preventScroll: true });
}
function closeItem() {
  cur = -1;
  sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true");
  document.querySelectorAll(".row.on").forEach((r) => r.classList.remove("on"));
  if (window.shelfBlur) window.shelfBlur();
}
$("#close").addEventListener("click", closeItem);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && cur >= 0) closeItem(); });
window.openItem = openItem;
window.ITEMS = ITEMS;
</script>

<script type="module">
/* 3D 书架。加载失败或没有 WebGL 时，#stage 隐藏，列表照常使用。 */
const stage = document.getElementById("stage");
const hasWebGL = () => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; } };

async function init() {
  if (!hasWebGL()) return stage.classList.add("nogl");
  let THREE;
  try { THREE = await import("three"); } catch (e) { return stage.classList.add("nogl"); }
  try {
    await document.fonts.load("500 58px 'Noto Serif SC'").catch(() => {});
    buildShelf(THREE);
  } catch (e) {
    console.warn("书架加载失败，只显示列表", e);
    stage.classList.add("nogl");
  }
}

function buildShelf(THREE) {
  const items = window.ITEMS;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = reduce ? 1 : 0.12;

  const W = stage.clientWidth, H = stage.clientHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  stage.insertBefore(renderer.domElement, stage.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  camera.position.set(0, 0.2, 11.5);
  camera.lookAt(0, 0.1, 0);

  scene.add(new THREE.AmbientLight(0xfff4e6, 0.85));
  const key = new THREE.DirectionalLight(0xfff0dc, 1.7);
  key.position.set(3, 6, 9);
  scene.add(key);

  // 书架：背板、隔板
  const back = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 3.6), new THREE.MeshStandardMaterial({ color: 0x1B1410, roughness: 1 }));
  back.position.set(0, 0.3, -0.9);
  scene.add(back);
  const board = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.22, 1.7), new THREE.MeshStandardMaterial({ color: 0x4A3328, roughness: 0.75 }));
  board.position.set(0, -1.2, 0);
  scene.add(board);

  // 书脊贴图：竖排的功能名 + 两道烫金线
  const spine = (item) => {
    const c = document.createElement("canvas");
    c.width = 400; c.height = 1024;
    const g = c.getContext("2d");
    g.fillStyle = item.color; g.fillRect(0, 0, 400, 1024);
    g.fillStyle = "rgba(240,220,170,.7)";
    g.fillRect(40, 80, 320, 5); g.fillRect(40, 939, 320, 5);
    g.fillStyle = "#F6EEDF";
    g.font = "500 60px 'Noto Serif SC', 'Songti SC', serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    const chars = [...item.name];
    const step = Math.min(72, 720 / chars.length);
    const y0 = 512 - (chars.length - 1) * step / 2;
    chars.forEach((ch, i) => g.fillText(ch, 200, y0 + i * step));
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  };

  const books = [];
  const bookW = 0.95, bookD = 1.5;
  const heights = [2.4, 2.2, 2.5, 2.3, 2.45];
  items.forEach((item, i) => {
    const h = heights[i % heights.length];
    const side = new THREE.MeshStandardMaterial({ color: new THREE.Color(item.color).multiplyScalar(0.7), roughness: 0.7 });
    const pages = new THREE.MeshStandardMaterial({ color: 0xEDE6D6, roughness: 0.9 });
    const front = new THREE.MeshStandardMaterial({ map: spine(item), roughness: 0.6 });
    const cover = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.6 });
    // BoxGeometry 材质顺序：+x -x +y -y +z(前) -z
    const mats = [pages, side, cover, cover, front, side];
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(bookW, h, bookD), mats);
    const x = (i - (items.length - 1) / 2) * 1.12;
    const y = -1.1 + h / 2;
    mesh.position.set(x, y, 0);
    mesh.userData = { index: i, bz: 0, by: y, tz: 0, ty: y, ry: 0 };
    scene.add(mesh);
    books.push(mesh);
  });

  // 点书：书往前走，并通知详情层
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const pick = (e) => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(books, false)[0];
    return hit ? hit.object.userData.index : -1;
  };
  renderer.domElement.addEventListener("click", (e) => {
    const i = pick(e);
    if (i >= 0 && window.openItem) window.openItem(i);
  });
  renderer.domElement.addEventListener("pointermove", (e) => {
    renderer.domElement.style.cursor = pick(e) >= 0 ? "pointer" : "default";
  });

  // 详情层调用：把选中的书推出来，其它退回去
  window.shelfFocus = (i) => {
    books.forEach((b) => {
      const on = b.userData.index === i;
      b.userData.tz = on ? b.userData.bz + 1.7 : b.userData.bz;
      b.userData.ty = on ? b.userData.by + 0.3 : b.userData.by;
      b.userData.ry = on ? -0.22 : 0;
    });
    const h = document.getElementById("hint");
    if (h) h.style.opacity = 0;
  };
  window.shelfBlur = () => window.shelfFocus(-1);

  function frame() {
    requestAnimationFrame(frame);
    books.forEach((b) => {
      const u = b.userData;
      b.position.z += (u.tz - b.position.z) * ease;
      b.position.y += (u.ty - b.position.y) * ease;
      b.rotation.y += (u.ry - b.rotation.y) * ease;
    });
    renderer.render(scene, camera);
  }
  frame();

  // 屏幕变化时重新算尺寸
  addEventListener("resize", () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
}

init();
</script>
</body>
</html>
