<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首页方案 B · 卡片</title>
<style>
:root{--paper:#F1F2F4;--sheet:#FFFFFF;--ink:#15171C;--ink-2:#5B606C;--ink-3:#8C919C;--rule:#D8DBE1;--accent:#2D4A8A;--accent-soft:#E4E9F4;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:0 16px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-top:28px}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;line-height:1.3;margin:0 0 20px;font-weight:700}
.grid{display:grid;gap:12px}
.card{display:grid;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;text-decoration:none;color:inherit}
.when{font-size:13px;color:var(--accent);background:var(--accent-soft);justify-self:start;padding:3px 10px;border-radius:99px}
.card h2{margin:2px 0 0;font-size:21px;font-weight:700;line-height:1.35}
.card p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.55}
.card .btn{margin-top:6px;justify-self:start;font-size:15px;font-weight:600;color:var(--accent)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.links a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--radius);color:var(--ink);text-decoration:none;font-size:16px;font-weight:600}
.foot{margin-top:24px;font-size:13px;color:var(--ink-3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3F9A62;margin-right:6px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>今天想用 AI 做什么？</h1>

  <div class="grid">
    <a class="card" href="#">
      <span class="when">想给粉丝一个互动</span>
      <h2>做一个粉丝测试页</h2>
      <p>说一句想要什么，几十秒生成一个能点的小测试。</p>
      <span class="btn">开始 ›</span>
    </a>
    <a class="card" href="#">
      <span class="when">进新组、接新职业前</span>
      <h2>职业功课卡</h2>
      <p>和律师、记者或老板聊十分钟，结束拿到一张卡：常用说法、习惯动作、一天怎么过。</p>
      <span class="btn">开始 ›</span>
    </a>
    <a class="card" href="#">
      <span class="when">发布会、采访前</span>
      <h2>采访问答练习</h2>
      <p>模拟记者的 5 个问题，每题给 2–3 个要点和一句能直接说的话。</p>
      <span class="btn">开始 ›</span>
    </a>
    <a class="card" href="#">
      <span class="when">拍戏时看不懂台词</span>
      <h2>古装台词速懂</h2>
      <p>拍一句台词，看白话意思、典故，和人物这时候会怎么做。</p>
      <span class="btn">开始 ›</span>
    </a>
    <a class="card" href="#">
      <span class="when">想整理人物</span>
      <h2>人物小传生成</h2>
      <p>回答 8 个问题，整理成一份只用你说过的话写的小传。</p>
      <span class="btn">开始 ›</span>
    </a>
  </div>

  <div class="links">
    <a href="#">我的收藏</a>
    <a href="#">随身话术卡</a>
  </div>
  <div class="foot"><span class="dot"></span>AI 已连接</div>
</div>
</body>
</html>
